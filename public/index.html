function parseMulti(val) {
  return val.split(/[;；]/).map(v => v.trim()).filter(Boolean).map((v, i) => ({ value: v, label: i === 0 ? (getLang() === 'en' ? 'Primary' : '主要') : (getLang() === 'en' ? 'Other' : '其他'), is_primary: i === 0 }));
}

async function saveContactForm() {
  const body = {
    full_name: document.getElementById('cmFullName').value,
    company: document.getElementById('cmCompany').value,
    job_title: document.getElementById('cmTitle').value,
    department: document.getElementById('cmDept').value,
    emails: parseMulti(document.getElementById('cmEmail').value),
    phones: parseMulti(document.getElementById('cmPhone').value),
    address: document.getElementById('cmAddress').value,
    website: document.getElementById('cmWebsite').value,
    category_id: document.getElementById('cmCategory').value || null,
    notes: document.getElementById('cmNotes').value,
  };
  if (!body.full_name.trim()) return alert('全名為必填');
  try {
    const url = ctEditingContactId ? `/api/contacts/${ctEditingContactId}` : '/api/contacts';
    const method = ctEditingContactId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).error);
    closeContactModal();
    loadContactsList();
  } catch (e) { alert('儲存失敗：' + e.message); }
}

// ===== Scan =====
function handleScanFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    ctScanImageData = { dataUrl: e.target.result, mimeType: file.type };
    document.getElementById('ctScanPreview').src = e.target.result;
    document.getElementById('ctScanPreview').style.display = '';
    document.getElementById('ctScanBtn').style.display = '';
  };
  reader.readAsDataURL(file);
}

async function startScan() {
  if (!ctScanImageData) return;
  document.getElementById('ctScanBtn').style.display = 'none';
  document.getElementById('ctScanLoading').style.display = '';
  try {
    const res = await fetch('/api/contacts/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: ctScanImageData.dataUrl, mimeType: ctScanImageData.mimeType }),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    const result = await res.json();
    fillScanForm(result);
  } catch (e) {
    alert((getLang() === 'en' ? 'Scan failed: ' : '掃描失敗：') + e.message);
    document.getElementById('ctScanBtn').style.display = '';
  } finally {
    document.getElementById('ctScanLoading').style.display = 'none';
  }
}

function fillScanForm(result) {
  const c = result.parsed || {};
  document.getElementById('ctFormName').value = c.full_name || '';
  document.getElementById('ctFormCompany').value = c.company || '';
  document.getElementById('ctFormTitle').value = c.job_title || '';
  document.getElementById('ctFormDept').value = c.department || '';
  document.getElementById('ctFormEmail').value = (c.emails || []).map(e => e.value).join('; ');
  document.getElementById('ctFormPhone').value = (c.phones || []).map(p => p.value).join('; ');
  document.getElementById('ctFormAddress').value = c.address || '';
  document.getElementById('ctFormWebsite').value = c.website || '';
  document.getElementById('ctFormNotes').value = result.notes || '';

  // Set category
  if (result.suggested_category) {
    const cat = ctCategoriesCache.find(x => x.name === result.suggested_category);
    if (cat) document.getElementById('ctFormCategory').value = cat.id;
  }

  // Confidence
  const conf = result.confidence || 0;
  const cls = conf >= 0.8 ? 'high' : conf >= 0.5 ? 'medium' : 'low';
  document.getElementById('ctScanConfidence').innerHTML = `<span class="ct-confidence ${cls}">AI 信心值：${Math.round(conf * 100)}%</span>`;

  // Check duplicates
  checkScanDuplicates(c);
}

async function checkScanDuplicates(contact) {
  const warn = document.getElementById('ctDupWarning');
  try {
    const res = await fetch('/api/contacts/check-duplicates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contacts: [contact] }),
    });
    if (!res.ok) return;
    const results = await res.json();
    const dups = results[0]?.duplicates || [];
    if (dups.length > 0) {
      warn.style.display = '';
      warn.innerHTML = `⚠️ 偵測到 ${dups.length} 筆可能重複的聯絡人：<br>` +
        dups.map(d => `<div style="margin-top:4px;">• <strong>${escHtml(d.contact.full_name)}</strong>（${escHtml(d.reasons.join(', '))}）<button class="btn btn-sm" style="margin-left:8px;" onclick="ctOverwriteContact('${d.contact.id}')">覆寫</button></div>`).join('');
    } else {
      warn.style.display = 'none';
    }
  } catch { warn.style.display = 'none'; }
}

let ctOverwriteId = null;
function ctOverwriteContact(id) {
  ctOverwriteId = id;
  document.getElementById('ctDupWarning').innerHTML = `✅ 將覆寫現有聯絡人，點擊「儲存聯絡人」確認。`;
}

async function saveScanContact() {
  const body = {
    full_name: document.getElementById('ctFormName').value,
    company: document.getElementById('ctFormCompany').value,
    job_title: document.getElementById('ctFormTitle').value,
    department: document.getElementById('ctFormDept').value,
    emails: parseMulti(document.getElementById('ctFormEmail').value),
    phones: parseMulti(document.getElementById('ctFormPhone').value),
    address: document.getElementById('ctFormAddress').value,
    website: document.getElementById('ctFormWebsite').value,
    category_id: document.getElementById('ctFormCategory').value || null,
    notes: document.getElementById('ctFormNotes').value,
    source_type: ctScanImageData ? 'scan' : 'manual',
  };
  if (ctOverwriteId) body.overwrite_id = ctOverwriteId;
  if (!body.full_name.trim()) return alert(getLang() === 'en' ? 'Full name is required' : '全名為必填');
  try {
    const res = await fetch('/api/contacts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    alert(getLang() === 'en' ? '✅ Contact saved' : '✅ 聯絡人已儲存');
    clearScanForm();
    ctOverwriteId = null;
    switchContactsSubTab('list');
    loadContactsList();
    // Check if company exists in pipeline leads; if not, offer to create a new lead
    if (body.company && body.company.trim()) {
      await checkAndOfferCreateLead(body);
    }
  } catch (e) { alert((getLang() === 'en' ? 'Save failed: ' : '儲存失敗：') + e.message); }
}

async function checkAndOfferCreateLead(contactData) {
  try {
    const res = await fetch('/api/pipeline/leads');
    if (!res.ok) return;
    const leads = await res.json();
    const companyName = (contactData.company || '').trim().toLowerCase();
    const exists = leads.some(l => (l.companyName || '').trim().toLowerCase() === companyName);
    if (!exists) {
      const msg = getLang() === 'en'
        ? `Company "${contactData.company}" is not in the pipeline. Create a new lead?`
        : `公司「${contactData.company}」尚未在商機列表中，是否要建立新商機？`;
      if (confirm(msg)) {
        // Pre-fill and open the lead creation modal
        editingLeadId = null;
        document.getElementById('leadModalTitle').textContent = L().plAddLead;
        document.getElementById('leadCompanyName').value = contactData.company || '';
        document.getElementById('leadTaxId').value = '';
        document.getElementById('leadAddress').value = contactData.address || '';
        document.getElementById('leadSalesperson').value = userDisplayName || '';
        document.getElementById('leadContactName').value = contactData.full_name || '';
        document.getElementById('leadContactEmail').value = (contactData.emails || [])[0]?.value || '';
        document.getElementById('leadContactPhone').value = (contactData.phones || [])[0]?.value || '';
        document.getElementById('leadStatus').value = '初步接觸';
        document.getElementById('leadCategory').value = '客戶';
        document.getElementById('leadDate').value = new Date().toISOString().slice(0, 10);
        document.getElementById('leadEstValue').value = '';
        document.getElementById('leadNotes').value = contactData.notes || '';
        document.getElementById('leadModalError').style.display = 'none';
        document.getElementById('leadModal').style.display = 'flex';
      }
    }
  } catch (e) { console.error('checkAndOfferCreateLead:', e); }

// Batch scan
async function handleBatchScan(input) {
  const files = Array.from(input.files).slice(0, 10);
  if (!files.length) return;
  const resultsDiv = document.getElementById('ctBatchResults');
  resultsDiv.innerHTML = `<div style="color:#1565c0;padding:12px;">AI 正在辨識 ${files.length} 張名片...</div>`;

  const images = [];
  for (const file of files) {
    const dataUrl = await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
    images.push({ image: dataUrl, mimeType: file.type, fileName: file.name });
  }

  try {
    const res = await fetch('/api/contacts/scan-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images }),
    });
    if (!res.ok) throw new Error((await res.json()).error);
    const data = await res.json();
    renderBatchResults(data.contacts);
  } catch (e) {
    resultsDiv.innerHTML = `<div style="color:#c62828;padding:12px;">批量掃描失敗：${escHtml(e.message)}</div>`;
  }
}

function renderBatchResults(contacts) {
  const div = document.getElementById('ctBatchResults');
  if (!contacts.length) { div.innerHTML = '<div class="ld-empty">未辨識到名片</div>'; return; }
  div.innerHTML = `<div style="margin-bottom:8px;font-size:13px;">辨識到 ${contacts.filter(c=>c.success).length}/${contacts.length} 張名片</div>` +
    contacts.map((c, i) => {
      if (!c.success) return `<div class="ct-batch-item" style="background:#ffebee;"><span>❌ ${escHtml(c.fileName)}: ${escHtml(c.error)}</span></div>`;
      const p = c.parsed || {};
      const conf = c.confidence || 0;
      const cls = conf >= 0.8 ? 'high' : conf >= 0.5 ? 'medium' : 'low';
      return `<div class="ct-batch-item">
        <input type="checkbox" checked data-batch-idx="${i}">
        <div style="flex:1;">
          <strong>${escHtml(p.full_name || '未知')}</strong> — ${escHtml(p.company || '')} ${escHtml(p.job_title || '')}
          <span class="ct-confidence ${cls}">${Math.round(conf*100)}%</span>
        </div>
      </div>`;
    }).join('') +
    `<div style="text-align:right;margin-top:10px;">
      <button class="btn btn-primary" onclick="saveBatchContacts()">💾 儲存已勾選</button>
    </div>`;
  // Store for saving
  window._batchScanResults = contacts;
}

async function saveBatchContacts() {
  const results = window._batchScanResults || [];
  const checkboxes = document.querySelectorAll('#ctBatchResults input[type="checkbox"]:checked');
  let saved = 0;
  for (const cb of checkboxes) {
    const idx = parseInt(cb.dataset.batchIdx);
    const r = results[idx];
    if (!r || !r.success) continue;
    const p = r.parsed || {};
    try {
      await fetch('/api/contacts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: p.full_name || '',
          company: p.company || '',
          job_title: p.job_title || '',
          department: p.department || '',
          emails: p.emails || [],
          phones: p.phones || [],
          address: p.address || '',
          website: p.website || '',
          notes: r.notes || '',
          source_type: 'scan',
          ai_confidence: r.confidence,
          ai_suggested_category: r.suggested_category,
        }),
      });
      saved++;
    } catch {}
  }
  alert(getLang() === 'en' ? `✅ Saved ${saved} contact(s)` : `✅ 已儲存 ${saved} 筆聯絡人`);
  // Collect unique companies from batch to check against pipeline
  const batchCompanies = [];
  for (const cb of checkboxes) {
    const idx = parseInt(cb.dataset.batchIdx);
    const r = results[idx];
    if (r && r.success && r.parsed?.company) batchCompanies.push(r.parsed);
  }
  document.getElementById('ctBatchResults').innerHTML = '';
  switchContactsSubTab('list');
  loadContactsList();
  // Check each unique company against pipeline
  if (batchCompanies.length) {
    const uniqueCompanies = [...new Map(batchCompanies.map(c => [c.company.toLowerCase(), c])).values()];
    for (const c of uniqueCompanies) {
      await checkAndOfferCreateLead(c);
    }
  }
}

  // Set default dates
  if (!ledgerInitialized) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth(); // 0-based
    const firstDay = `${y}-${String(m + 1).padStart(2, '0')}-01`;

async function loadLedgerAccounts() {
  if (ledgerAccountsCache.length > 0) {
    renderLedgerAccountList();
    return;
  }
  const companyId = getCompanyId();
  try {
    const res = await fetch(`/api/accounts?companyId=${companyId}`);
    if (res.ok) {
      const json = await res.json();
      ledgerAccountsCache = (json.data || json).sort((a, b) => (a.number || '').localeCompare(b.number || ''));
      renderLedgerAccountList();
    }
  } catch (e) {
    console.error('Failed to load accounts:', e);
  }
}

function onLedgerTypeChange() {
  const type = document.getElementById('ledgerQueryType').value;
  // Show account filter only for GL entries
  document.getElementById('ledgerAccountFilter').style.display = type === 'gl-entries' ? '' : 'none';
}

function filterLedgerAccounts() {
  renderLedgerAccountList();
}

function renderLedgerAccountList() {
  const search = (document.getElementById('ledgerAccountSearch').value || '').toLowerCase();
  const container = document.getElementById('ledgerAccountList');

  const filtered = ledgerAccountsCache.filter(a => {
    if (!search) return true;
    return (a.number || '').toLowerCase().includes(search) ||
           (a.displayName || '').toLowerCase().includes(search);
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="padding:8px;color:#999;font-size:12px;">無符合科目</div>';
    return;
  }

  // Group by category for easier navigation
  const groups = {};
  filtered.forEach(a => {
    const cat = a.category || 'Other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(a);
  });
  const catOrder = ['Assets', 'Liabilities', 'Equity', 'Income', 'Cost of Goods Sold', 'Expense', 'Other'];
  const sortedCats = Object.keys(groups).sort((a, b) => {
    const ia = catOrder.indexOf(a), ib = catOrder.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  let html = '';
  for (const cat of sortedCats) {
    html += `<div style="padding:4px 6px;font-size:11px;font-weight:600;color:#1a1a2e;background:#f0f2f5;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:1;">${cat} (${groups[cat].length})</div>`;
    html += groups[cat].map(a => {
      const checked = ledgerSelectedAccounts.has(a.number) ? 'checked' : '';
      return `<label style="display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;font-size:12px;border-bottom:1px solid #f5f5f5;" onmouseenter="this.style.background='#f8f9fa'" onmouseleave="this.style.background=''">
        <input type="checkbox" ${checked} onchange="toggleLedgerAccount('${a.number}','${(a.displayName||'').replace(/'/g, "\\'")}')">
        <span style="color:#1a1a2e;font-weight:500;min-width:60px;">${a.number}</span>
        <span style="color:#555;">${a.displayName || ''}</span>
      </label>`;
    }).join('');
  }
  container.innerHTML = html;
  container.style.maxHeight = '350px'; // taller to see more
}

function toggleLedgerAccount(number, name) {
  if (ledgerSelectedAccounts.has(number)) {
    ledgerSelectedAccounts.delete(number);
  } else {
    ledgerSelectedAccounts.set(number, name);
  }
  renderLedgerSelectedChips();
  renderLedgerAccountList();
}

function renderLedgerSelectedChips() {
  const container = document.getElementById('ledgerSelectedChips');
  if (ledgerSelectedAccounts.size === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = Array.from(ledgerSelectedAccounts.entries()).map(([num, name]) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;background:#e3f2fd;color:#1565c0;padding:2px 8px;border-radius:12px;font-size:11px;cursor:default;">
      ${num} ${name}

    </span>`

function removeLedgerAccount(number) {
  ledgerSelectedAccounts.delete(number);
  renderLedgerSelectedChips();
  renderLedgerAccountList();

  ledgerSelectedAccounts.clear();

async function fetchLedger() {
  const type = document.getElementById('ledgerQueryType').value;
  const startDate = document.getElementById('ledgerStartDate').value;
  const endDate = document.getElementById('ledgerEndDate').value;
  const companyId = getCompanyId();
  const l = L();

  const resultsEl = document.getElementById('ledgerResults');
  const summaryEl = document.getElementById('ledgerSummary');
  resultsEl.innerHTML = `<div class="loading">${l.ledgerLoading}</div>`;
  summaryEl.textContent = '';

  try {
    if (type === 'gl-entries') {
      if (!startDate || !endDate) {
        resultsEl.innerHTML = '<div class="loading" style="color:#c62828;">請選擇開始和結束日期</div>';
        return;
      }
      let url = `/api/ledger/gl-entries?companyId=${companyId}&startDate=${startDate}&endDate=${endDate}`;
      if (ledgerSelectedAccounts.size > 0) {
        url += `&accountNumbers=${Array.from(ledgerSelectedAccounts.keys()).join(',')}`;
      }
      const res = await fetch(url);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error);
      renderGLEntries(json.data || [], l);
      summaryEl.textContent = `${startDate} ~ ${endDate} | ${(json.data || []).length} ${l.ledgerCount}`;

    } else if (type === 'trial-balance') {
      const dateFilter = startDate && endDate ? `${startDate}..${endDate}` : undefined;
      let url = `/api/ledger/trial-balance?companyId=${companyId}`;
      if (dateFilter) url += `&dateFilter=${dateFilter}`;
      const res = await fetch(url);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error);
      renderTrialBalance(json.data || [], l);
      summaryEl.textContent = dateFilter ? `${startDate} ~ ${endDate}` : '';

    } else if (type === 'journals') {
      const res = await fetch(`/api/ledger/journals?companyId=${companyId}`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error);
      renderJournals(json.data || [], l, companyId);
    }
  } catch (e) {
    resultsEl.innerHTML = `<div class="loading" style="color:#c62828;">Error: ${e.message}</div>`;
  }
}

    const res = await fetch(`/api/ledger/journals/${journalId}/lines?companyId=${companyId}`);
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);

    const lines = json.data || [];
    if (lines.length === 0) {
      cell.innerHTML = `<div style="padding:12px;color:#999;">${l.ledgerNoData}</div>`;
      return;
    }

    const fmt = v => v != null ? v.toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : '0';

    let html = `<div style="padding:8px 12px;background:#f8f9fa;border-top:2px solid #1976d2;">
    <table style="width:100%;border-collapse:collapse;font-size:11px;">
      <thead>
        <tr style="background:#e3f2fd;color:#1565c0;">
          <th style="padding:5px 4px;text-align:left;">${l.ledgerLineNo}</th>
          <th style="padding:5px 4px;text-align:left;">${l.ledgerDate}</th>
          <th style="padding:5px 4px;text-align:left;">${l.ledgerDocNo}</th>
          <th style="padding:5px 4px;text-align:left;">${l.ledgerAcctNo}</th>
          <th style="padding:5px 4px;text-align:left;">${l.ledgerDesc}</th>
          <th style="padding:5px 4px;text-align:right;">${l.ledgerAmount}</th>
        </tr>
      </thead>
      <tbody>`;

    lines.forEach((line, i) => {
      const bg = i % 2 === 0 ? '' : 'background:#fff;';
      const amt = line.amount || 0;
      html += `<tr style="${bg}">
        <td style="padding:4px;border-bottom:1px solid #eee;">${line.lineNumber || ''}</td>
        <td style="padding:4px;border-bottom:1px solid #eee;">${line.postingDate || ''}</td>
        <td style="padding:4px;border-bottom:1px solid #eee;">${line.documentNumber || ''}</td>
        <td style="padding:4px;border-bottom:1px solid #eee;font-weight:500;">${line.accountNumber || ''}</td>
        <td style="padding:4px;border-bottom:1px solid #eee;color:#666;">${line.description || ''}</td>
        <td style="padding:4px;border-bottom:1px solid #eee;text-align:right;color:${amt >= 0 ? '#1565c0' : '#c62828'};">${fmt(amt)}</td>
      </tr>`;
    });

    html += `</tbody></table></div>`;
    cell.innerHTML = html;
  } catch (e) {
    cell.innerHTML = `<div style="padding:12px;color:#c62828;">Error: ${e.message}</div>`;
  }
}

// Re-load accounts when company changes (for ledger tab)
document.getElementById('companySelect').addEventListener('change', () => {
  ledgerAccountsCache = [];
  ledgerSelectedAccounts.clear();
  if (currentTab === 'ledger') {
    loadLedgerAccounts();
    renderLedgerSelectedChips();
  }
});

// Init
initDates();
</script>
</body>
</html>
