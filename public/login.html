<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BBT Financial Reporter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }
  .header { background: #1a1a2e; color: white; padding: 16px 24px; text-align: center; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .subtitle { font-size: 12px; color: #aaa; }
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .login-card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 36px 32px; width: 100%; max-width: 380px; }
  .login-card h2 { font-size: 20px; margin-bottom: 24px; text-align: center; color: #1a1a2e; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: #1a1a2e; }
  .btn-login { width: 100%; padding: 11px; background: #1a1a2e; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn-login:hover { background: #2d2d5e; }
  .btn-login:disabled { background: #999; cursor: wait; }
  .error-msg { color: #c62828; font-size: 13px; text-align: center; margin-bottom: 14px; display: none; }
  .demo-logins { display: none; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
  .demo-logins .title { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; }
  .demo-btn { width: 100%; margin-top: 8px; padding: 9px 10px; border: 1px solid #d9e2ec; border-radius: 6px; background: #f8fafc; color: #1f2933; font-size: 13px; cursor: pointer; text-align: left; }
  .demo-btn:hover { background: #eef5ff; border-color: #b6d4fe; }
  .demo-btn span { display: block; color: #66788a; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>BBT Financial Reporter</h1>
  <div class="subtitle">BBTruck</div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <h2>登入</h2>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">帳號</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">登入</button>
    </form>
    <div class="demo-logins" id="demoLogins">
      <div class="title">本機測試角色</div>
      <button type="button" class="demo-btn" onclick="demoLogin('sales.expense', 'demo123')">業務部（申請人）<span>建立草稿、送出簽核</span></button>
      <button type="button" class="demo-btn" onclick="demoLogin('manager.expense', 'demo123')">業務部主管（批准人）<span>查看主管待簽核、核准/退回</span></button>
      <button type="button" class="demo-btn" onclick="demoLogin('finance.expense', 'demo123')">財務部（處理人）<span>查看財務待處理、核准/付款</span></button>
    </div>
  </div>
</div>

<script>
// If already logged in, redirect to dashboard
fetch('/auth/me', { credentials: 'same-origin' }).then(r => { if (r.ok) window.location.href = '/'; });

if (['localhost', '127.0.0.1', '::1'].includes(window.location.hostname)) {
  document.getElementById('demoLogins').style.display = 'block';
}

async function doLogin(e) {
  e.preventDefault();
  await submitLogin();
}

async function demoLogin(username, password) {
  document.getElementById('username').value = username;
  document.getElementById('password').value = password;
  await submitLogin();
}

async function submitLogin() {
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = '登入中...';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    window.location.href = '/';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '登入';
  }
}
</script>
</body>
</html>
