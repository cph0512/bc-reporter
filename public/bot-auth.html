<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot 帳號綁定 — Velopulse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;padding:28px;width:90%;max-width:380px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
h2{color:#2F5496;margin-bottom:6px;text-align:center;font-size:20px}
.subtitle{text-align:center;color:#666;font-size:13px;margin-bottom:20px}
label{display:block;font-size:13px;color:#555;margin-bottom:4px;margin-top:12px;font-weight:500}
input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
input:focus{outline:none;border-color:#2F5496;box-shadow:0 0 0 2px rgba(47,84,150,.15)}
button{width:100%;padding:12px;background:#2F5496;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:18px;font-weight:600}
button:hover{background:#244682}
button:disabled{background:#aaa;cursor:not-allowed}
.msg{text-align:center;margin-top:12px;font-size:14px;display:none;padding:10px;border-radius:8px}
.msg-err{color:#C62828;background:#FFEBEE}
.msg-ok{color:#2E7D32;background:#E8F5E9}
.expired{text-align:center;color:#C62828;margin-top:20px;font-size:14px}
.footer{text-align:center;margin-top:16px;font-size:11px;color:#aaa}
</style></head>
<body>
<div class="card">
  <h2>📊 Velopulse 帳號綁定</h2>
  <p class="subtitle">登入後即可在 LINE Bot 中直接使用報表功能</p>
  <div id="form">
    <label>帳號 (Email)</label>
    <input id="user" type="email" placeholder="your@email.com" autocomplete="username">
    <label>密碼</label>
    <input id="pass" type="password" placeholder="密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="btn" onclick="doLogin()">登入並綁定</button>
  </div>
  <div class="msg msg-err" id="err"></div>
  <div class="msg msg-ok" id="ok"></div>
  <div class="footer">帳號密碼不會儲存在 Bot 中，僅用於驗證身份</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('form').innerHTML = '<div class="expired">無效的連結，請從 LINE Bot 重新取得登入連結。</div>';
}

async function doLogin() {
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('err');
  const okEl = document.getElementById('ok');

  if (!user || !pass) { errEl.textContent = '請填寫帳號和密碼'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '驗證中...';
  errEl.style.display = 'none'; okEl.style.display = 'none';

  try {
    const r = await fetch('/api/bot-auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, username: user, password: pass })
    });
    const d = await r.json();
    if (d.ok) {
      okEl.textContent = '✅ 綁定成功！' + (d.displayName ? '（' + d.displayName + '）' : '') + ' 可以關閉此頁面了。';
      okEl.style.display = 'block';
      document.getElementById('form').style.display = 'none';
    } else {
      errEl.textContent = d.error || '登入失敗';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = '登入並綁定';
    }
  } catch (e) {
    errEl.textContent = '連線失敗，請稍後再試';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '登入並綁定';
  }
}
</script>
</body></html>
